{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
    <a href="{% url 'main:show_main' %}">Profile</a>
    <a href="{% url 'main:show_experience' %}">Experience</a>
    <a href="{% url 'main:show_education' %}">Education</a>
    <a href="{% url 'main:download_portfolio_pdf' %}">Download PDF</a>

    <label for="theme-toggle" class="theme-toggle-label">
        <span class="theme-icon theme-icon--light">☀</span>
        <span class="theme-icon theme-icon--dark">☾</span>
        <span class="theme-toggle-text">Theme</span>
    </label>
</nav>
        </div>
    </header>
    {% block content %} {% endblock %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
